name: jeneponto_kurir
description: "Jeneponto Kurir - layanan antar & kirim paket wilayah Jeneponto (multi-role: Customer, Kurir, Admin)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.0

  # Functional helpers (Either<Failure, T>)
  dartz: ^0.10.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.0

  # Util
  intl: ^0.19.0
  uuid: ^4.5.1

  # UI
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

  # Peta & tautan pembayaran (fitur delivery/payments)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0

  # Opsional - aktifkan bila ingin Google Maps (butuh API key):
  # google_maps_flutter: ^2.9.0
  # geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
